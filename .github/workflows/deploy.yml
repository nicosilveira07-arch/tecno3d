name: Deploy TECNO 3D

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-0cf5c7842decc394e" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy TECNO3D from GitHub Actions" \
            --parameters 'commands=[
              "sudo -u ec2-user -H bash -c '\''cd /home/ec2-user/tecno3d && git config --global --add safe.directory /home/ec2-user/tecno3d && git pull --ff-only origin master'\''",
              "sudo -u ec2-user -H bash -c '\''cd /home/ec2-user/tecno3d/backend && npm install && npx prisma generate && npx prisma migrate deploy && pm2 restart tecno3d-api'\''",
              "sudo -u ec2-user -H bash -c '\''cd /home/ec2-user/tecno3d/frontend && npm install && npm run build'\''",
              "sudo systemctl reload nginx"
            ]' \
            --region sa-east-1