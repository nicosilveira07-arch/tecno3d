name: Deploy TECNO 3D

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/tecno3d
            git pull --ff-only origin master
            cd backend
            npm install
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart tecno3d-backend
            cd ../frontend
            npm install
            npm run build
            sudo systemctl reload nginx